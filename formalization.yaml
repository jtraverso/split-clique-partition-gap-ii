version: "v0.4"
project:
  name: "Stability of the Clique Partition Gap in Split Graphs"
  description: >-
    In a finite split graph whose host neighborhoods are independent in the residual core graph,
    a proper assignment missing L required pairs realizes the residual integral-fractional packing
    gap to within 2L. Deleting q crossing edges from a complete assignment changes the gap by at
    most 2q. For a split presentation with core size c and at least 2c hosts, the gap is at most
    twice the sum of endpoint omissions in excess of floor(c/2).
  authors: ["Juan Pablo Traverso Gianini"]
  responsible_maintainers: ["Juan Pablo Traverso Gianini"]
  license: Apache-2.0
